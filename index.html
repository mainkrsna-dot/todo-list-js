<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-container">
    <section class="todo-card">
      <header class="todo-header">
        <h1>To Do List</h1>
        <p>Add tasks, mark them complete, and remove them when done.</p>
      </header>

      <form id="todo-form" class="todo-form">
        <input id="todo-input" type="text" placeholder="Add a new task" aria-label="New todo" autocomplete="off" />
        <button type="submit">Add</button>
      </form>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <p id="empty-message" class="empty-message">No tasks yet. Add one above!</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
